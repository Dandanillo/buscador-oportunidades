name: Buscador

on:
  schedule:
    - cron: '15 */2 * * *'     # cada 2 horas
  workflow_dispatch:           # boton "Run workflow" para actualizar a mano

permissions:
  contents: write

concurrency:
  group: buscador
  cancel-in-progress: false

jobs:
  buscador:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install yfinance pandas numpy requests lxml
      - name: Actualizar datos
        run: python scanner.py
      - name: Guardar datos en el repo
        run: |
          git config user.name  "buscador-bot"
          git config user.email "buscador-bot@users.noreply.github.com"
          git add -f docs/datos.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "buscador: actualizar datos"
            git pull --rebase
            git push
          fi
